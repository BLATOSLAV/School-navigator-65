

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Навигатор школы №65</title>

<style>

body{margin:0;font-family:Arial,sans-serif;background:#eef3fb;color:#18243a}

header{background:#2457c5;color:white;padding:24px 18px;text-align:center}

header h1{font-size:24px;margin:0 0 8px}

main{max-width:700px;margin:auto;padding:16px}

button{background:white;color:#2457c5;border:1px solid #d5def0;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.panel{background:white;padding:18px;border-radius:16px;margin-top:16px;line-height:1.6;box-shadow:0 2px 8px #0000000a}

.hidden{display:none}

.back{margin-bottom:12px;background:#e3ebff}

a{color:#2457c5}

</style>

</head>

<body>

<header>

<h1>🏫 Навигатор школы №65</h1>

<div>Корпус 3 · Помощник ученика</div>

</header>

<main>

<div id="home">

<div class="panel">

<b>Куда направляемся?</b><br>

Выбери нужный раздел.

</div>

<div class="menu">

<button onclick="show('subjects')">📚 Предметы</button>

<button onclick="show('rooms')">🚪 Кабинеты</button>

<button onclick="show('teachers')">👩‍🏫 Учителя</button>

<button onclick="show('routes')">🧭 Маршруты</button>

<button onclick="show('floors')">🏢 Этажи</button>

<button onclick="show('places')">🛋️ Места школы</button>

</div>

</div>

<div id="content" class="hidden">

<button class="back" onclick="goHome()">← Главное меню</button>

<div class="panel" id="details"></div>

</div>

</main>

<script>

const data={

subjects:`<h2>📚 Предметы</h2>

История — 214<br>Русский язык — 220<br>Литература — 220<br>

Биология — 315<br>География — 314<br>Технология — 114 или 116<br>

Музыка — 401<br>ИЗО — 401<br>Английский язык — 419<br>

Математика — 421 (уточняй расписание)<br>Физкультура — спортзал №2`,

rooms:`<h2>🚪 Кабинеты</h2>

114 — технология (предположительно для девочек)<br>

116 — технология<br>214 — история<br>220 — русский язык и литература<br>

314 — география<br>315 — биология<br>401 — музыка и ИЗО<br>

419 — английский язык<br>421 — математика (ориентировочно)<br>

Физкультура — спортивный зал №2`,

teachers:`<h2>👩‍🏫 Учителя</h2>

История — Альфия Рамильевна, 214<br>

Русский язык — Галина Сергеевна, 220<br>

Литература — Галина Сергеевна, 220<br>

Биология — Екатерина Олеговна, 315<br>

География — Алёна Николаевна, 314<br>

Технология — Андрей Анатольевич, 116<br>

Музыка — Динис Русланович, 401<br>

ИЗО — Наталья Владимировна, 401<br>

Английский — Анжелика Владимировна, 419<br>

Математика — Людмила Николаевна, 421 (ориентировочно)<br>

Физкультура — Мария Михайловна, спортзал №2`,

routes:`<h2>🧭 Маршруты</h2>

<b>От входа до кабинета 315:</b><br>

Пройди гардероб и турникеты. Иди прямо мимо центральной лестницы и медпункта 112. Правее находится боковая центральная лестница. Поднимись на 3-й этаж — кабинет 315 будет виден сразу.<br><br>

<b>От входа до кабинета 419:</b><br>

Пройди гардероб и турникеты, поверни направо к центральной лестнице и поднимись на 4-й этаж. Поверни направо через стеклянную дверь — кабинет 419.<br><br>

<b>Важно:</b> на 3-й этаж нельзя пройти обычным путём по центральной лестнице. Используй боковую или боковую центральную лестницу.`,

floors:`<h2>🏢 Этажи и блоки</h2>

Блок Н — начальная школа.<br>

Блок С — старшая школа.<br>

Блок Ц — центральная часть: столовая и спортивные залы.<br><br>

3-й этаж: кабинеты 314 (география) и 315 (биология). Иди по боковой или боковой центральной лестнице.<br><br>

4-й этаж: кабинет 419 — английский язык; кабинет 421 — математика (ориентировочно).<br><br>

2-й этаж: кабинет 220 — русский язык и литература; спортивный зал №2.`,

places:`<h2>🛋️ Места школы</h2>

Столовая — в центральном блоке Ц, после холла.<br>

Медпункт — кабинет 112, по пути от входа к лестницам.<br>

Зоны отдыха — диванчики, столы и места для сидения в коридорах.<br>

Спортивные залы — центральный блок Ц.<br><br>

Блок Н находится слева от центральной части, блок С — справа.`

};

function show(key){

document.getElementById('home').classList.add('hidden');

document.getElementById('content').classList.remove('hidden');

document.getElementById('details').innerHTML=data[key];

}

function goHome(){

document.getElementById('content').classList.add('hidden');

document.getElementById('home').classList.remove('hidden');

}

</script>

</body>

</html>
